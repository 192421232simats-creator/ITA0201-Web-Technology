<!DOCTYPE html>
<html>
<head>
<title>Student Profile</title>
</head>
<body>

<h2 id="heading">Student Profile</h2>

<div id="profile">
<p id="name">Name: Maria</p>
<p id="dept">Department: Information Technology</p>
</div>

<button onclick="changeHeading()">Change Heading</button>
<button onclick="changeText()">Change Text Colour</button>
<button onclick="changeBackground()">Change Background</button>
<button onclick="hideProfile()">Show/Hide Profile</button>

<script>
function changeHeading() {
    document.getElementById("heading").textContent = "My Student Profile";
}

function changeText() {
    document.querySelector("#profile").style.color = "blue";
}

function changeBackground() {
    document.querySelector("#profile").style.backgroundColor = "lightyellow";
}

function hideProfile() {
    document.getElementById("profile").classList.toggle("hide");
}

</script>

<style>
.hide {
    display: none;
}
</style>

</body>
</html>

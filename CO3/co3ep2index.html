<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Dashboard</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        .box {
            width: 500px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 2px solid black;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

        li {
            text-align: left;
            margin: 10px;
            padding: 10px;
            background-color: lightcyan;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Student Registration Dashboard</h1>

    <input type="text" id="name" placeholder="Student Name">
    <br>

    <input type="text" id="reg" placeholder="Register Number">
    <br>

    <input type="text" id="dept" placeholder="Department">
    <br>

    <button onclick="addStudent()">Add Student</button>
    <button onclick="clearAll()">Clear All</button>

    <h2>Registered Students</h2>

    <ul id="studentList"></ul>

</div>

<script>

function addStudent() {

    let name = document.getElementById("name").value;
    let reg = document.getElementById("reg").value;
    let dept = document.getElementById("dept").value;

    if (name == "" || reg == "" || dept == "") {
        alert("Please enter all student details");
        return;
    }

    let li = document.createElement("li");

    li.textContent = name + " | " + reg + " | " + dept;

    let removeButton = document.createElement("button");

    removeButton.textContent = "Remove";

    removeButton.onclick = function() {
        this.parentElement.remove();
    };

    li.appendChild(removeButton);

    document.getElementById("studentList").appendChild(li);

    document.getElementById("name").value = "";
    document.getElementById("reg").value = "";
    document.getElementById("dept").value = "";
}

function clearAll() {
    document.getElementById("studentList").innerHTML = "";
}

</script>

</body>
</html>
